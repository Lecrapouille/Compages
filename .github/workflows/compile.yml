name: Compages build and tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Linux
  # ============================================================================
  build-linux:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache the third parties
        uses: actions/cache@v4
        with:
          path: ~/.cache/mymakefile
          key: mymakefile-${{ runner.os }}-${{ hashFiles('external/versions.lock') }}

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake git pkg-config ccache \
            libgl1-mesa-dev libgl1-mesa-dri libglfw3-dev \
            libdw-dev lcov \
            mesa-utils xvfb xauth

      - name: Download, configure and install Google test
        run: |
          wget https://github.com/google/googletest/releases/download/v1.17.0/googletest-1.17.0.tar.gz
          tar xf googletest-1.17.0.tar.gz
          cd googletest-1.17.0
          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON .
          sudo make install

      - name: Describe the build
        id: info
        run: make -s ci-info >> "$GITHUB_OUTPUT"

      - name: Build Compages and gallery
        run: make all

      - name: Build and run unit tests with llvmpipe
        run: |
          xvfb-run -a env \
            LIBGL_ALWAYS_SOFTWARE=1 \
            MESA_GL_VERSION_OVERRIDE=4.5 \
            MESA_GLSL_VERSION_OVERRIDE=450 \
            make check

      - name: Check all gallery examples with llvmpipe
        run: |
          xvfb-run -a env \
            LIBGL_ALWAYS_SOFTWARE=1 \
            MESA_GL_VERSION_OVERRIDE=4.5 \
            MESA_GLSL_VERSION_OVERRIDE=450 \
            ${{ steps.info.outputs.build }}/bin/Compages-examples --check

      # Before the installation: sudo writes in the build folder.
      - name: Gather the build artifacts
        run: make dist

      - name: Install Compages
        run: |
          sudo make install MYMAKEFILE_CACHE="$HOME/.cache/mymakefile"
          sudo ldconfig

      - name: Build and run an installed consumer
        run: |
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          pkg-config --modversion Compages
          cat > /tmp/compages-consumer.cpp <<'CPP'
          #include <Compages/Compages.hpp>

          int main()
          {
              return compages::gpu::initialized() ? 1 : 0;
          }
          CPP
          c++ -std=c++20 /tmp/compages-consumer.cpp \
            -o /tmp/compages-consumer \
            $(pkg-config --cflags --libs Compages)
          /tmp/compages-consumer

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: compages-linux-x86_64
          path: ${{ steps.info.outputs.dist_dir }}/
          if-no-files-found: error

  # ============================================================================
  # macOS
  # ============================================================================
  build-macos:
    name: Build and test on macOS
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache the third parties
        uses: actions/cache@v4
        with:
          path: ~/.cache/mymakefile
          key: mymakefile-${{ runner.os }}-${{ hashFiles('external/versions.lock') }}

      - name: Install packages
        run: |
          brew install make cmake glfw pkg-config lcov ccache
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig" >> "$GITHUB_ENV"

      - name: Download, configure and install Google test
        run: |
          wget https://github.com/google/googletest/releases/download/v1.17.0/googletest-1.17.0.tar.gz
          tar xf googletest-1.17.0.tar.gz
          cd googletest-1.17.0
          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON .
          sudo make install

      - name: Describe the build
        id: info
        run: gmake -s ci-info >> "$GITHUB_OUTPUT"

      - name: Build Compages and gallery
        run: gmake all

      - name: Build and run unit tests
        run: gmake check

      # Before the installation: sudo writes in the build folder.
      - name: Gather the build artifacts
        run: gmake dist

      - name: Install Compages
        run: sudo gmake install MYMAKEFILE_CACHE="$HOME/.cache/mymakefile"

      - name: Build and run an installed consumer
        run: |
          pkg-config --modversion Compages
          cat > /tmp/compages-consumer.cpp <<'CPP'
          #include <Compages/Compages.hpp>

          int main()
          {
              return compages::gpu::initialized() ? 1 : 0;
          }
          CPP
          c++ -std=c++20 /tmp/compages-consumer.cpp \
            -o /tmp/compages-consumer \
            $(pkg-config --cflags --libs Compages)
          DYLD_LIBRARY_PATH=/usr/local/lib /tmp/compages-consumer

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: compages-macos-arm64
          path: ${{ steps.info.outputs.dist_dir }}/
          if-no-files-found: error

  # ============================================================================
  # Release packaging (tags and manual runs)
  # ============================================================================
  package:
    name: Package release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      RELEASE_DIR: release/Compages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^PROJECT_VERSION' Makefile | awk '{print $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Combine artifacts
        run: |
          mkdir -p "$RELEASE_DIR/linux-x86_64" "$RELEASE_DIR/macos-arm64"

          if [ -d artifacts/compages-linux-x86_64 ]; then
            cp -a artifacts/compages-linux-x86_64/. "$RELEASE_DIR/linux-x86_64/"
            find "$RELEASE_DIR/linux-x86_64" -name "*.so*" -exec chmod +x {} \;
            chmod +x "$RELEASE_DIR/linux-x86_64/bin/"* 2>/dev/null || true
            echo "Linux artifacts copied"
          fi

          if [ -d artifacts/compages-macos-arm64 ]; then
            cp -a artifacts/compages-macos-arm64/. "$RELEASE_DIR/macos-arm64/"
            chmod +x "$RELEASE_DIR/macos-arm64/bin/"* 2>/dev/null || true
            echo "macOS artifacts copied"
          fi

          cp LICENSE "$RELEASE_DIR/"
          echo "${{ steps.version.outputs.version }}" > "$RELEASE_DIR/VERSION"

      - name: Create release archive
        run: |
          ZIP_NAME="Compages-${{ steps.version.outputs.version }}.zip"
          cd "$(dirname "$RELEASE_DIR")"
          zip -ry "../$ZIP_NAME" "$(basename "$RELEASE_DIR")"/
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload combined artifact
        uses: actions/upload-artifact@v6
        with:
          name: Compages-${{ steps.version.outputs.version }}
          path: ${{ env.RELEASE_DIR }}/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
