name: Compages build and tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Linux
  # ============================================================================
  build-linux:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache the third parties
        uses: actions/cache@v4
        with:
          path: ~/.cache/mymakefile
          key: mymakefile-${{ runner.os }}-${{ hashFiles('external/versions.lock') }}

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake git pkg-config ccache \
            libgl1-mesa-dev libgl1-mesa-dri libglfw3-dev libegl-dev \
            libdw-dev lcov \
            mesa-utils xvfb xauth

      - name: Download, configure and install Google test
        run: |
          wget https://github.com/google/googletest/releases/download/v1.17.0/googletest-1.17.0.tar.gz
          tar xf googletest-1.17.0.tar.gz
          cd googletest-1.17.0
          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON .
          sudo make install

      - name: Describe the build
        id: info
        run: make -s ci-info >> "$GITHUB_OUTPUT"

      - name: Build Compages and gallery
        run: make all

      - name: Build and run unit tests with llvmpipe
        run: |
          xvfb-run -a env \
            LIBGL_ALWAYS_SOFTWARE=1 \
            MESA_GL_VERSION_OVERRIDE=4.5 \
            MESA_GLSL_VERSION_OVERRIDE=450 \
            make check

      - name: Check all gallery examples with llvmpipe
        run: |
          xvfb-run -a env \
            LIBGL_ALWAYS_SOFTWARE=1 \
            MESA_GL_VERSION_OVERRIDE=4.5 \
            MESA_GLSL_VERSION_OVERRIDE=450 \
            ${{ steps.info.outputs.build }}/bin/Compages-examples --check

      - name: Draw a scene into a PNG with no screen (EGL, llvmpipe)
        run: |
          env LIBGL_ALWAYS_SOFTWARE=1 \
            MESA_GL_VERSION_OVERRIDE=4.5 \
            MESA_GLSL_VERSION_OVERRIDE=450 \
            ${{ steps.info.outputs.build }}/bin/Compages-headless headless.png 640 360

      # Before the installation: sudo writes in the build folder.
      - name: Gather the build artifacts
        run: make dist

      - name: Install Compages
        run: |
          sudo make install MYMAKEFILE_CACHE="$HOME/.cache/mymakefile"
          sudo ldconfig

      - name: Build and run an installed consumer
        run: |
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          pkg-config --modversion Compages
          cat > /tmp/compages-consumer.cpp <<'CPP'
          #include <Compages/Compages.hpp>

          int main()
          {
              return compages::gpu::initialized() ? 1 : 0;
          }
          CPP
          c++ -std=c++20 /tmp/compages-consumer.cpp \
            -o /tmp/compages-consumer \
            $(pkg-config --cflags --libs Compages)
          /tmp/compages-consumer

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: compages-linux-x86_64
          path: ${{ steps.info.outputs.dist_dir }}/
          if-no-files-found: error

  # ============================================================================
  # The backends of macOS (GL41) and of the web (GLES3), checked on Linux with
  # llvmpipe: a 4.1 core context, and an OpenGL ES 3.0 one. The gallery must
  # fail exactly the demos of .github/gallery-expected-failures.txt (they need
  # compute shaders or storage blocks that these backends do not emulate).
  # ============================================================================
  backends-linux:
    name: Backend ${{ matrix.backend }} on Linux (llvmpipe)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        backend: [GL41, GLES3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache the third parties
        uses: actions/cache@v4
        with:
          path: ~/.cache/mymakefile
          key: mymakefile-${{ runner.os }}-${{ hashFiles('external/versions.lock') }}

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake git pkg-config ccache \
            libgl1-mesa-dev libgl1-mesa-dri libglfw3-dev libegl-dev libgles-dev \
            libdw-dev mesa-utils xvfb xauth

      - name: Download, configure and install Google test
        run: |
          wget https://github.com/google/googletest/releases/download/v1.17.0/googletest-1.17.0.tar.gz
          tar xf googletest-1.17.0.tar.gz
          cd googletest-1.17.0
          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON .
          sudo make install

      - name: Build Compages and the gallery
        run: make BUILD_DIR=build-${{ matrix.backend }} GPU_BACKEND=${{ matrix.backend }} all

      - name: Build and run unit tests with llvmpipe
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            make BUILD_DIR=build-${{ matrix.backend }} GPU_BACKEND=${{ matrix.backend }} check

      - name: Check the gallery with llvmpipe
        run: |
          BUILD=$(make -s BUILD_DIR=build-${{ matrix.backend }} GPU_BACKEND=${{ matrix.backend }} print-BUILD)
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            $BUILD/bin/Compages-examples --check > gallery.log 2>&1 || true
          cat gallery.log
          grep -E '^  [0-9]{2}[a-z]_' gallery.log | awk '{print $1}' | sort > failed.txt
          diff -u .github/gallery-expected-failures.txt failed.txt

  # ============================================================================
  # macOS
  # ============================================================================
  build-macos:
    name: Build and test on macOS
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache the third parties
        uses: actions/cache@v4
        with:
          path: ~/.cache/mymakefile
          key: mymakefile-${{ runner.os }}-${{ hashFiles('external/versions.lock') }}

      - name: Install packages
        run: |
          brew install make cmake glfw pkg-config lcov ccache
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig" >> "$GITHUB_ENV"

      - name: Download, configure and install Google test
        run: |
          wget https://github.com/google/googletest/releases/download/v1.17.0/googletest-1.17.0.tar.gz
          tar xf googletest-1.17.0.tar.gz
          cd googletest-1.17.0
          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON .
          sudo make install

      - name: Describe the build
        id: info
        run: gmake -s ci-info >> "$GITHUB_OUTPUT"

      - name: Build Compages and gallery
        run: gmake all

      - name: Build and run unit tests
        run: gmake check

      # macOS builds the GL41 backend (OpenGL 4.1, the last one of Apple). Not
      # yet checked on a real Mac: kept from failing the run until it passes.
      - name: Check the gallery (GL41)
        continue-on-error: true
        run: |
          ${{ steps.info.outputs.build }}/bin/Compages-examples --check > gallery.log 2>&1 || true
          cat gallery.log
          grep -E '^  [0-9]{2}[a-z]_' gallery.log | awk '{print $1}' | sort > failed.txt
          diff -u .github/gallery-expected-failures.txt failed.txt

      # Before the installation: sudo writes in the build folder.
      - name: Gather the build artifacts
        run: gmake dist

      - name: Install Compages
        run: sudo gmake install MYMAKEFILE_CACHE="$HOME/.cache/mymakefile"

      - name: Build and run an installed consumer
        run: |
          pkg-config --modversion Compages
          cat > /tmp/compages-consumer.cpp <<'CPP'
          #include <Compages/Compages.hpp>

          int main()
          {
              return compages::gpu::initialized() ? 1 : 0;
          }
          CPP
          c++ -std=c++20 /tmp/compages-consumer.cpp \
            -o /tmp/compages-consumer \
            $(pkg-config --cflags --libs Compages)
          DYLD_LIBRARY_PATH=/usr/local/lib /tmp/compages-consumer

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: compages-macos-arm64
          path: ${{ steps.info.outputs.dist_dir }}/
          if-no-files-found: error

  # ============================================================================
  # The gallery in a web page (Emscripten, WebGL 2), published on GitHub Pages.
  # Pages must use "GitHub Actions" as its source (Settings > Pages).
  # ============================================================================
  build-web:
    name: Build the web gallery (WebGL 2)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache the third parties
        uses: actions/cache@v4
        with:
          path: ~/.cache/mymakefile
          key: mymakefile-web-${{ hashFiles('external/versions.lock') }}

      # Pinned: a new Emscripten brings a new libc++, which may stop
      # including a header for us. Raise it on purpose, after a local build.
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13

      - name: Build the gallery for the web
        run: make TOOLCHAIN=emscripten COMPILATION_MODE=release Compages-examples

      - name: Gather the page
        run: |
          mkdir -p site
          cp build/emscripten-release/bin/Compages-examples.* site/
          cp site/Compages-examples.html site/index.html
          ls -la site

      - name: Install Node (WebSocket, for the browser check)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A few demos in a headless Chrome: a triangle, a compute shader (the
      # emulated one), lamps and shadows, a glTF model.
      - name: Check some demos in a headless browser
        run: |
          python3 -m http.server -d site 8080 > /dev/null 2>&1 &
          for demo in 01c_Triangle 05f_Galaxy 06d_Lights 08a_GltfModel; do
            echo "::group::$demo"
            node examples/Web/check.mjs "http://127.0.0.1:8080/index.html?args=--check%20$demo" 300
            echo "::endgroup::"
          done

      - name: Keep the page for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-web:
    name: Publish the web gallery on GitHub Pages
    needs: build-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================================
  # Release packaging (tags and manual runs)
  # ============================================================================
  package:
    name: Package release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      RELEASE_DIR: release/Compages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^PROJECT_VERSION' Makefile | awk '{print $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Combine artifacts
        run: |
          mkdir -p "$RELEASE_DIR/linux-x86_64" "$RELEASE_DIR/macos-arm64"

          if [ -d artifacts/compages-linux-x86_64 ]; then
            cp -a artifacts/compages-linux-x86_64/. "$RELEASE_DIR/linux-x86_64/"
            find "$RELEASE_DIR/linux-x86_64" -name "*.so*" -exec chmod +x {} \;
            chmod +x "$RELEASE_DIR/linux-x86_64/bin/"* 2>/dev/null || true
            echo "Linux artifacts copied"
          fi

          if [ -d artifacts/compages-macos-arm64 ]; then
            cp -a artifacts/compages-macos-arm64/. "$RELEASE_DIR/macos-arm64/"
            chmod +x "$RELEASE_DIR/macos-arm64/bin/"* 2>/dev/null || true
            echo "macOS artifacts copied"
          fi

          cp LICENSE "$RELEASE_DIR/"
          echo "${{ steps.version.outputs.version }}" > "$RELEASE_DIR/VERSION"

      - name: Create release archive
        run: |
          ZIP_NAME="Compages-${{ steps.version.outputs.version }}.zip"
          cd "$(dirname "$RELEASE_DIR")"
          zip -ry "../$ZIP_NAME" "$(basename "$RELEASE_DIR")"/
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload combined artifact
        uses: actions/upload-artifact@v6
        with:
          name: Compages-${{ steps.version.outputs.version }}
          path: ${{ env.RELEASE_DIR }}/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
